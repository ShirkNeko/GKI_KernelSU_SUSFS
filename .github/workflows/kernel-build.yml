name: Kernel Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android 版本'
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
          - android17
        default: android13
      kernel_version:
        description: 'Kernel 版本'
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
          - "6.18"
        default: "5.15"
      sub_level:
        description: 'Sub Level 版本'
        required: true
        type: string
        default: '124'
      os_patch_level:
        description: 'OS Patch Level'
        required: true
        type: string
        default: '2025-02'
      revision:
        description: 'Android 12 Revision (可选)'
        required: false
        type: string
        default: ''
      page_size:
        description: 'ARM64 Page Size (16k 仅支持 6.1/6.6/6.12/6.18)'
        required: true
        type: choice
        options:
          - 4k
          - 16k
        default: 4k
      kernelsu_version:
        description: 'SukiSU 版本'
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Custom(自定义)
        default: Stable(标准)
      kernelsu_branch:
        description: '自定义 SukiSU 分支 / tag / commit（仅 Custom 时使用，留空回退 builtin-new）'
        required: false
        type: string
        default: ''
      kernelsu_commit:
        description: '指定 SukiSU commit (可选，优先级最高)'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: '指定 SUSFS commit hash'
        required: false
        type: string
        default: ''
      custom_version:
        description: '自定义版本名称 (可选)'
        required: false
        type: string
        default: ''
      use_zram:
        description: '启用 ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: false
      use_kpm:
        description: '启用 KPM'
        required: true
        type: boolean
        default: true
      BBG:
        description: '启用 Baseband-guard'
        required: true
        type: boolean
        default: false
      supp_op:
        description: '启用 OnePlus 8E 支持'
        required: true
        type: boolean
        default: false
      set_defbbr:
        description: '设置 BBR 为默认拥塞算法'
        required: true
        type: boolean
        default: false
      send_telegram:
        description: '发送 Telegram 通知'
        required: true
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.10'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          verbose: 'true'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y ccache python3 git curl wget zip unzip

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-${{ github.event.inputs.page_size }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-${{ github.event.inputs.page_size }}-ccache-

      - name: Build kernel
        env:
          ANDROID_VERSION: ${{ github.event.inputs.android_version }}
          KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
          SUB_LEVEL: ${{ github.event.inputs.sub_level }}
          OS_PATCH_LEVEL: ${{ github.event.inputs.os_patch_level }}
          REVISION: ${{ github.event.inputs.revision }}
          PAGE_SIZE: ${{ github.event.inputs.page_size }}
          KSU_VERSION: ${{ github.event.inputs.kernelsu_version }}
          KSU_BRANCH: ${{ github.event.inputs.kernelsu_branch }}
          KSU_COMMIT: ${{ github.event.inputs.kernelsu_commit }}
          SUSFS_COMMIT: ${{ github.event.inputs.susfs_commit }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
          USE_ZRAM: ${{ github.event.inputs.use_zram }}
          USE_KPM: ${{ github.event.inputs.use_kpm }}
          USE_BBG: ${{ github.event.inputs.BBG }}
          USE_OP8E: ${{ github.event.inputs.supp_op }}
          SET_DEF_BBR: ${{ github.event.inputs.set_defbbr }}
        run: python3 ./.github/workflows/scripts/build.py --from-env

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          BUILD_DIR="/tmp/gki-build/${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}"
          if [ "${{ github.event.inputs.page_size }}" = "16k" ]; then
            BUILD_DIR="${BUILD_DIR}-16k"
          fi
          if [ -d "$BUILD_DIR" ]; then
            find "$BUILD_DIR" -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*.img' -o -name 'build-info-*.json' -o -name 'abi-*.json' \) \
              -exec cp -t artifacts/ -- {} +
          fi
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "没有找到构建产物: $BUILD_DIR"
            exit 1
          fi
          ls -la artifacts/
          (
            cd artifacts
            find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.img' \) -print0 \
              | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          )

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}${{ github.event.inputs.page_size == '16k' && '-16k' || '' }}
          path: artifacts/*

      - name: Send Telegram Notification
        if: ${{ github.event.inputs.send_telegram == 'true' && success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          KSU_BRANCH_INPUT: ${{ github.event.inputs.kernelsu_branch }}
          KSU_COMMIT_INPUT: ${{ github.event.inputs.kernelsu_commit }}
          SUB_LEVEL_INPUT: ${{ github.event.inputs.sub_level }}
          OS_PATCH_INPUT: ${{ github.event.inputs.os_patch_level }}
        run: |
          KSU_REF=""
          BUILD_INFO=$(find /tmp/gki-build -name 'build-info-*.json' -print -quit)
          if [ -n "$BUILD_INFO" ]; then
            KSU_REF=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ksu"]["resolved_ref"])' "$BUILD_INFO")
          fi
          if [ -z "$KSU_REF" ]; then
            KSU_REF="$KSU_BRANCH_INPUT"
          fi
          if [ -z "$KSU_REF" ]; then
            KSU_REF="$KSU_COMMIT_INPUT"
          fi
          python3 ./.github/workflows/scripts/telegram_notify.py single \
            --android "${{ github.event.inputs.android_version }}" \
            --kernel "${{ github.event.inputs.kernel_version }}" \
            --sub-level "$SUB_LEVEL_INPUT" \
            --os-patch "$OS_PATCH_INPUT" \
            --ksu-version "${{ github.event.inputs.kernelsu_version }}" \
            --ksu-ref "$KSU_REF" \
            --zram "${{ github.event.inputs.use_zram }}" \
            --kpm "${{ github.event.inputs.use_kpm }}" \
            --page-size "${{ github.event.inputs.page_size }}" \
            --hashes "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"
