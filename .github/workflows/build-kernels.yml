name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'SukiSU 版本'
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Custom(自定义)
        default: Stable(标准)
      kernelsu_branch:
        description: '自定义 SukiSU 分支 / tag / commit（仅 Custom 时使用，留空回退 builtin-new）'
        required: false
        type: string
        default: ''
      kernelsu_commit:
        description: '指定 SukiSU commit (可选，优先级最高)'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: '指定 SUSFS commit hash 或相对偏移 (如 HEAD~1)'
        required: false
        type: string
        default: ''
      custom_version:
        description: '自定义版本名称 (可选)'
        required: false
        type: string
        default: ''
      use_zram:
        description: '启用 ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: false
      use_kpm:
        description: '启用 KPM'
        required: true
        type: boolean
        default: true
      BBG:
        description: '启用 Baseband-guard'
        required: true
        type: boolean
        default: false
      make_release:
        description: '创建 GitHub Release'
        required: true
        type: boolean
        default: true
      send_telegram:
        description: '发送 Telegram 通知'
        required: true
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.10'

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      SCRIPTS_DIR: ./.github/workflows/scripts
    outputs:
      build_matrix: ${{ steps.generate.outputs.build_matrix }}
      kernel_version: ${{ steps.generate.outputs.kernel_version }}
      classified_matrix: ${{ steps.generate.outputs.classified_matrix }}
      matrix_summary: ${{ steps.generate.outputs.matrix_summary }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate build matrix
        id: generate
        run: python3 ${{ env.SCRIPTS_DIR }}/matrix_generator.py

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    env:
      SCRIPTS_DIR: ./.github/workflows/scripts
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          verbose: 'true'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y ccache python3 git curl wget zip unzip xz-utils openssl pixz

      - name: Setup AVB signing key
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        run: |
          mkdir -p toolchain/linux-x86/bin
          echo "$BOOT_SIGN_KEY" > toolchain/linux-x86/bin/testkey.pem
          echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/toolchain/linux-x86/bin/testkey.pem" >> $GITHUB_ENV

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          mkdir -p ~/.ccache
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        id: restore-ccache
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ github.ref_name }}-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.label }}
          cache_bucket: ccache-cache

      - name: Build kernel
        env:
          ANDROID_VERSION: ${{ matrix.config.android }}
          KERNEL_VERSION: ${{ matrix.config.kernel }}
          SUB_LEVEL: ${{ matrix.config.sub_level }}
          OS_PATCH_LEVEL: ${{ matrix.config.os_patch }}
          REVISION: ${{ matrix.config.revision }}
          KSU_VERSION: ${{ github.event.inputs.kernelsu_version }}
          KSU_BRANCH: ${{ github.event.inputs.kernelsu_branch }}
          KSU_COMMIT: ${{ github.event.inputs.kernelsu_commit }}
          SUSFS_COMMIT: ${{ github.event.inputs.susfs_commit }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
          USE_ZRAM: ${{ github.event.inputs.use_zram }}
          USE_KPM: ${{ github.event.inputs.use_kpm }}
          USE_BBG: ${{ github.event.inputs.BBG }}
          PAGE_SIZE: ${{ matrix.config.page_size }}
        run: python3 ${{ env.SCRIPTS_DIR }}/build.py --from-env

      - name: Save ccache
        uses: ./.github/actions/cache-save
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ github.ref_name }}-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.label }}
          cache_bucket: ccache-cache
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare artifacts
        id: prepare-artifacts
        run: |
          mkdir -p artifacts
          find /tmp/gki-build -name "*.zip" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "*.img" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "build-info-*.json" -type f -exec cp {} artifacts/ \;
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "没有找到构建产物"
            echo "artifacts_exist=false" >> $GITHUB_OUTPUT
          else
            echo "artifacts_exist=true" >> $GITHUB_OUTPUT
            ls -la artifacts/
            cd artifacts
            find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.img' \) -printf '%P\n' \
              | sort | xargs -r sha256sum > SHA256SUMS.txt
            cd ..
          fi

      - name: Upload artifacts
        if: steps.prepare-artifacts.outputs.artifacts_exist == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.label }}
          path: artifacts/*

      - name: Record build result
        if: always()
        run: |
          mkdir -p build-results
          if [ -f "artifacts/SHA256SUMS.txt" ]; then
            cp artifacts/SHA256SUMS.txt build-results/${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.label }}.txt
          fi
          echo "${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.label }}:outcome=${{ job.status }}" >> build-results/status.txt

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-results-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.label }}
          path: build-results/
          retention-days: 1

  release:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' && github.event.inputs.make_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SCRIPTS_DIR: ./.github/workflows/scripts
      WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download kernel artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          pattern: 'kernel-*'
          merge-multiple: true

      - name: Download build results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: 'build-results-*'
          path: build-results
          merge-multiple: true

      - name: Prepare build summary
        id: prepare-summary
        run: |
          mkdir -p build-results all-artifacts
          echo "=== 构建摘要 ===" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(cat build-results/status.txt 2>/dev/null | wc -l || echo 0)
          SUCCESS=$(grep ':outcome=success$' build-results/status.txt 2>/dev/null | wc -l || echo 0)
          FAILED=$(grep ':outcome=failure$' build-results/status.txt 2>/dev/null | wc -l || echo 0)
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "| Total | Success | Failed |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| $TOTAL | $SUCCESS | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "=== 状态 ==="
          cat build-results/status.txt 2>/dev/null || echo "No status file"

      - name: Prepare release files
        if: steps.prepare-summary.outputs.success != '0'
        run: |
          mkdir -p release-files
          python3 ${{ env.SCRIPTS_DIR }}/extract_artifacts.py all-artifacts release-files --build-results build-results
          ls -la release-files/

      - name: Generate release body
        if: steps.prepare-summary.outputs.success != '0'
        run: |
          python3 ${{ env.SCRIPTS_DIR }}/release_generator.py release-files/RELEASE_BODY.md --build-info-dir all-artifacts
          echo "=== 发布内容 ==="
          cat release-files/RELEASE_BODY.md

      - name: Create release
        if: steps.prepare-summary.outputs.success != '0'
        uses: softprops/action-gh-release@v3
        id: create_release
        with:
          tag_name: ${{ needs.prepare.outputs.kernel_version }}
          name: GKI Kernel ${{ needs.prepare.outputs.kernel_version }}
          draft: false
          generate_release_notes: false
          files: |
            release-files/*
          body_path: release-files/RELEASE_BODY.md

      - name: Get release URL
        if: steps.prepare-summary.outputs.success != '0'
        id: get-release-url
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.kernel_version }}"
          echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo "Release URL: $RELEASE_URL"

      - name: Send Telegram Notification
        if: ${{ github.event.inputs.send_telegram == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          SUCCESS: ${{ steps.prepare-summary.outputs.success }}
          FAILED: ${{ steps.prepare-summary.outputs.failed }}
        run: |
          HASHS_ARG=""
          if [ -f release-files/SHA256SUMS.txt ]; then
            HASHS_ARG="--hashes release-files/SHA256SUMS.txt"
          fi
          python3 ${{ env.SCRIPTS_DIR }}/telegram_notify.py release \
            --tag "${{ needs.prepare.outputs.kernel_version }}" \
            --url "${{ steps.get-release-url.outputs.release_url }}" \
            --notes-file release-files/RELEASE_BODY.md \
            $HASHS_ARG \
            --success "${SUCCESS:-0}" \
            --failed "${FAILED:-0}"
